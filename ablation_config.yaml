# ==============================================================
# META-SUPERVISOR SETTINGS (Batch Control)
# ==============================================================
ablation:
  runs_per_density: 100
  densities: [2.0] #[1.5, 1.75, 2.0, 2.5, 3.0]
  radii: [0.5] #[0.5, 0.3, 0.1]
  experiment_script_path: "src/rmf_gz/run_experiment.py"
  #controller_script_path: "/home/arl/nCBF3D/nCBF3D/G_ROS_interface/ROS2/sim_node_lidar.py"
  controller_script_path: "/home/arl/nCBF3D/nCBF3D/G_ROS_interface/ROS2/sim_node_lidar_regression.py"
  #controller_script_path: "/home/arl/nCBF3D/nCBF3D/G_ROS_interface/ROS2/sim_node_lidar_ccbf.py"
  #controller_script_path: "/home/arl/nCBF3D/nCBF3D/G_ROS_interface/ROS2/sim_node_lidar_daf.py"


# ===========================================================
# Setting for ablation across controllers
# ===========================================================
controllers: ["heuristic"]  #["heuristic", "blind", "random", "ego"]
# "ego": EGO-Planner reference controller (Zhou et al., ICRA 2021), ported in
#        nCBF3D/G_ROS_interface/classes/ego_planner.py
USE_PASSTHROUGH: false # if to disable the safety filter and just use the heuristic above


# ==============================================================
# Settings for ablation across lidar rate
# ==============================================================
lidar_rates: [20] #[20, 3, 1]


# ==============================================================
# Settings for ablation across lidar freuquency
# ==============================================================
lidar_noise_scale: [0.0] #[0.0, 1.0, 3.0]


# ==============================================================
# SIMULATION ENVIRONMENT SETTINGS (Gazebo Setup)
# ==============================================================
simulation:
  world_name: "random3d"
  headless: false
  robot_name: "rmf"
  run_timeout_s: 100.0
  spawn_pose:
    x: 0.0
    y: 0.0
    z: 0.15

# ==============================================================
# TERMINATION CONDITIONS (sim_runner.py Logic)
# ==============================================================
termination:
  success_x_dist_m: 30.0       # Distance required to register a "SUCCESS"
  progress_window_s: 5.0       # Time window to check for stall/stuck conditions
  progress_min_dx_m: 0.5       # Minimum forward progress required per window
  imu_accel_threshold: 50.0    # m/s^2 spike indicating a physical collision
  imu_stabilization_s: 0.25     # Grace period to ignore spawn/drop physics jolts

# ==============================================================
# ROS 2 TOPICS (Middleware Routing)
# ==============================================================
topics:
  odom: "/rmf/odom"
  imu: "/rmf/imu"
  cmd_acc: "/rmf/cmd/acc"