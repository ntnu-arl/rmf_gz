worlds:
  n: 25
  seed: 1000
  poisson_radius:
  - 2.0
  - 4.0
  pillar_radius: 0.5
method:
  node: nCBF3D.G_ROS_interface.ROS2.sim_node_lidar_ccbf:CompositeCBFControlNode
  baseline:
    CCBF_KAPPA: 80.0
    CCBF_POLE_0: -2.5
    CCBF_ALPHA: 2.0
  grid:
    CCBF_KAPPA:
    - 640.0
    - 1280.0
    - 2560.0
    - 5120.0
    - 10240.0
    CCBF_POLE_0:
    - -2.5
    - -3.5
    - -5.0
    - -7.0
  fixed:
    CCBF_ALPHA: 1.0
  constraints:
  - CCBF_POLE_0 < 0
  - CCBF_ALPHA > 0
